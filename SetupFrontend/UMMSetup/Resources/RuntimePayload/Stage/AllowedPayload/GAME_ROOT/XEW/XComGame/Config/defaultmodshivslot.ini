;eTech=eFoundry_TacticalRigging,         // Tactical Rigging
;eTech=25,								 // Alien Metallurgy
;eTech=26,								 // Aircraft Boosters
;eTech=27,								 // Wingtip Sparrowhawks
;eTech=28,								 // Penetrator Weapons
;eTech=30,								 // Advanced Surgery
;eTech=31,								 // Improved Avionics
;eTech=32,								 // UFO Countermeasures
;eTech=33,								 // Elerium Afterburners
;eTech=34,								 // Supercapacitors
;eTech=35,								 // Enhanced UFO Detection
;eTech=38,								 // Alien Nucleonics
;eTech=39,								 // Improved Salvage Techniques
