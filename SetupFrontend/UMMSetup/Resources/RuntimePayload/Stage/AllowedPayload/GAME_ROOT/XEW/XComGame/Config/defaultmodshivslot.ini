[ShivSlot.ShivSlotMutator]

;set SHIV_SLOT_ENABLED=FALSE to hard-disable the mod
SHIV_SLOT_ENABLED=TRUE

;NUM_SHIV_SLOTS is the minimum number of available slots, can be expanded/replaced with UnlockTech lines (see further)
NUM_SHIV_SLOTS=1
;use the lines below to define techs that unlock more slots
;replace zeros with tech id and number of slots
;the unlocked slots are added on top of NUM_SHIV_SLOTS 
;you can copy the lines to have more tech-slot pairs

;eTech=eFoundry_SHIV,				     // Enhanced Ballistic Weaponry
;eTech=eFoundry_AlienGrenades,		     // Alien Grenades
;eTech=eFoundry_MedikitII,			     // Improved Medikit
;eTech=eFoundry_ArcThrowerII,		     // Improved Arc Thrower
;eTech=eFoundry_VehicleRepair,		     // Advanced Repair
;eTech=eFoundry_AutomatedLasers,	     // Enhanced Laser Weaponry
;eTech=eFoundry_AutomatedPlasma,	     // Enhanced Plasma Weaponry
;eTech=eFoundry_SHIV_Heal,			     // Field Repairs
;eTech=eFoundry_CaptureDrone,			 // Capture Drone
;eTech=eFoundry_AmmoConservation,		 // Ammo Conservation
;eTech=eFoundry_AdvancedFlight,			 // Advanced Flight
;eTech=eFoundry_AdvancedConstruction,	 // Armored Fighters
;eTech=eFoundry_PistolI,				 // Mag Pistols
;eTech=eFoundry_PistolII,				 // Rail Pistols
;eTech=eFoundry_PistolIII,				 // Reflex Pistols
;eTech=eFoundry_SHIVSuppression,		 // SHIV Suppression
;eTech=eFoundry_StealthSatellites,		 // Stealth Satellites
;eTech=eFoundry_Scope,					 // Enhanced SCOPE
;eTech=eFoundry_EleriumFuel,			 // Jellied Elerium
;eTech=eFoundry_MECCloseCombat,			 // MEC Close Combat
;eTech=eFoundry_AdvancedServomotors,	 // Advanced Servomotors
;eTech=eFoundry_ShapedArmor,			 // Shaped Armor
